name: Feature Request
description: Propose an improvement for builders adapting the repo into a Telegram CRM.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep requests focused on reusable CRM capabilities, local demo quality, security posture, or Telegram integration boundaries.

        Do not include real Telegram messages, phone numbers, session strings, API keys, `.env` files, database dumps, screenshots with secrets, or provider logs with secrets. Report sensitive security issues privately through the process in `SECURITY.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What builder or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior, API, or documentation change.
    validations:
      required: true
  - type: dropdown
    id: telegram
    attributes:
      label: Telegram Impact
      options:
        - No Telegram access needed
        - Telegram bot only
        - Telegram MTProto sync
        - Outbound Telegram sending
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety Considerations
      description: Note any credential, privacy, data-field, export, logging, AI-provider, tenant-isolation, outbound-send, Telegram import, or user-data risks. Use synthetic examples only.
      placeholder: |
        Data fields:
        Exports:
        Logs/audit events:
        AI/provider egress:
        Telegram/send/import impact:
        Browser-visible sensitive data:
    validations:
      required: true
