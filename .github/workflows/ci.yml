name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:open-source
      - run: pnpm audit --prod
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  demo-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: gordian_dev
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gordian_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BETTER_AUTH_SECRET: demo-smoke-better-auth-secret-min-32
      BETTER_AUTH_URL: http://localhost:3456
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gordian_dev
      DEV_KMS_BYPASS: 'true'
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/gordian_dev
      DRAGONFLY_URL: redis://localhost:6379
      INTERNAL_AUTH_SECRET: demo-smoke-internal-secret-min-32
      NEXT_PUBLIC_TELEGRAM_LINKING_ENABLED: 'false'
      SEED_PASSWORD: gordian-demo
      TELEGRAM_BOT_ENABLED: 'false'
      TELEGRAM_MTPROTO_ENABLED: 'false'
      TELEGRAM_SEND_ENABLED: 'false'
      WEB_URL: http://localhost:3456
      WORKER_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm seed:demo
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e -- demo-smoke.spec.ts
