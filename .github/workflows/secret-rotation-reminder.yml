name: Secret Rotation Reminder

on:
  workflow_dispatch:

jobs:
  create-reminder:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Quarterly Secret Rotation - ${new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}`,
              body: `## Quarterly Secret Rotation Checklist

            Rotate the following secrets and redeploy all affected services:

            - [ ] \`WORKER_INTERNAL_SECRET\` - web and worker runtime environments
            - [ ] \`INTERNAL_AUTH_SECRET\` - internal service authentication
            - [ ] \`BETTER_AUTH_SECRET\` - web runtime environment
            - [ ] \`HANDOFF_JWT_SECRET\` - handoff token signing
            - [ ] \`OAUTH_STATE_SECRET\` - OAuth state signing
            - [ ] Database URLs and passwords - application runtimes and managed database settings
            - [ ] \`AWS_ACCESS_KEY_ID\` / \`AWS_SECRET_ACCESS_KEY\` - runtime environments and IAM source IP policies
            - [ ] AI provider keys - runtime environments
            - [ ] Observability keys - runtime environments
            - [ ] Deployment tokens - GitHub Actions secrets, only if demo deployment is intentionally enabled
            - [ ] \`BOT_TOKEN\` - Telegram BotFather token, if Telegram bot is enabled
            - [ ] \`TELEGRAM_API_HASH\` - Telegram API app secret, if MTProto is enabled
            - [ ] Stored Telegram sessions - revoke all real user sessions before publishing or after compromise

            ### Steps
            1. Generate new secrets: \`openssl rand -hex 32\`
            2. Update the affected runtime environment variables
            3. Update GitHub Actions secrets only for intentionally enabled demo infrastructure
            4. Revoke superseded Telegram bot tokens and user sessions
            5. Verify app health after each rotation
            6. Close this issue when complete
            `,
              labels: ['security']
            });
