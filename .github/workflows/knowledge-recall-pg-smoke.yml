name: Knowledge Recall Postgres Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/knowledge-recall-pg-smoke.yml'
      - 'apps/web/src/app/actions/knowledge.ts'
      - 'packages/db/drizzle/**'
      - 'packages/db/src/__tests__/fixtures/knowledge-recall-*'
      - 'packages/db/src/__tests__/knowledge-recall-*.test.ts'
      - 'packages/db/src/dal/knowledge.ts'
      - 'packages/db/src/dal/memories.ts'
      - 'packages/db/src/dal/messages.ts'
      - 'packages/db/src/schema/knowledge.ts'
      - 'packages/db/src/schema/memories.ts'
      - 'packages/db/src/schema/messages.ts'
      - 'scripts/knowledge-recall-pg-smoke.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/knowledge-recall-pg-smoke.yml'
      - 'apps/web/src/app/actions/knowledge.ts'
      - 'packages/db/drizzle/**'
      - 'packages/db/src/__tests__/fixtures/knowledge-recall-*'
      - 'packages/db/src/__tests__/knowledge-recall-*.test.ts'
      - 'packages/db/src/dal/knowledge.ts'
      - 'packages/db/src/dal/memories.ts'
      - 'packages/db/src/dal/messages.ts'
      - 'packages/db/src/schema/knowledge.ts'
      - 'packages/db/src/schema/memories.ts'
      - 'packages/db/src/schema/messages.ts'
      - 'scripts/knowledge-recall-pg-smoke.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-trixie
        env:
          POSTGRES_DB: gordian_recall_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gordian_recall_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gordian_recall_test
      DEV_KMS_BYPASS: 'true'
      KG_RECALL_PG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gordian_recall_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.15.4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm kg:recall:pg:smoke
