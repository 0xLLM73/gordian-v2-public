services:
  postgres:
    image: pgvector/pgvector:0.8.4-pg16-trixie
    environment:
      POSTGRES_DB: gordian_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gordian_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.0.6-alpine3.21
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--protected-mode",
        "yes",
        "--save",
        "60",
        "1"
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
